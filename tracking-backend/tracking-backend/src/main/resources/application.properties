# Nom de l'application
spring.application.name=tracking-backend

# Port du serveur : port Railway en production, 8080 en local
server.port=${PORT:8080}

# Configuration MongoDB
# Railway : utilise la variable MONGODB_URI
# Local : utilise MongoDB sur localhost si la variable n'est pas définie
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tracking_db}

# JWT
# En production, définir JWT_SECRET dans les variables Railway
app.jwt.secret=${JWT_SECRET:change-me-in-production-please-very-long-secret-key-32chars-min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Administrateur par défaut
# En production, définir ADMIN_EMAIL et ADMIN_PASSWORD dans Railway
app.admin.default-email=${ADMIN_EMAIL:admin@aurex.com}
app.admin.default-password=${ADMIN_PASSWORD:Admin@2024!}