
# Nom de l'application
spring.application.name=tracking-backend

# Port du serveur backend
server.port=8080

# Configuration MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tracking_db}
# JWT
app.jwt.secret=change-me-in-production-please-very-long-secret-key-32chars-min
app.jwt.expiration-ms=28800000

# Admin par défaut (créé au premier démarrage)
app.admin.default-email=admin@aurex.com
app.admin.default-password=Admin@2024!